name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *" # daily live check against Studionet
  workflow_dispatch:

jobs:
  test:
    name: Tests (simulated contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: MCP server with the official MCP Python SDK (independent client)
        run: |
          pip install mcp
          npm run test:mcp-client
      - name: The committed Vercel function is up to date
        run: npm run vercel:check

  live:
    name: Live read-only checks (Studionet)
    # Only on the daily schedule or a manual run. A network outage must not block a pull request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:live
